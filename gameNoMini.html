//*********************************************
// COLICIONES AABB CIRCULOS Y RECTANGULOS
// CONVENCIÓN DE ÍNDICES:
// [0]: x
// [1]: y
// [2]: radio (0 si es rectángulo)
// [3]: ancho (0 si es círculo)
// [4]: alto  (0 si es círculo)
//*********************************************

const RESPUESTA_COLISION = [0, 0]; // Bufer de respuesta de colicion global

function colision(a, b, sol) {
  // Aceptamos un array 'sol' preasignado [0, 0] para evitar Garbage Collection
  sol[0] = 0; 
  sol[1] = 0;

  const p1x = a[0], p1y = a[1], r1 = a[2], w1 = a[3], h1 = a[4];
  const p2x = b[0], p2y = b[1], r2 = b[2], w2 = b[3], h2 = b[4];

  // 1. CIRCULO - CIRCULO
  if (r1 > 0 && r2 > 0) {
    const dx = p1x - p2x;
    const dy = p1y - p2y;
    const dist = m.hypot(dx, dy) || 1;
    const overlap = (r1 + r2) - dist;

    if (overlap > 0) {
      sol[0] = (dx / dist) * overlap;
      sol[1] = (dy / dist) * overlap;
      return true;
    }
    return false;
  }

  // 2. CIRCULO - RECTANGULO
  if (r1 > 0 || r2 > 0) {
    const isA = r1 > 0;
    const cx = isA ? p1x : p2x;
    const cy = isA ? p1y : p2y;
    const rad = isA ? r1 : r2;

    const rx = isA ? p2x : p1x;
    const ry = isA ? p2y : p1y;
    const rw = isA ? w2 : w1;
    const rh = isA ? h2 : h1;

    const px = m.max(rx, m.min(cx, rx + rw));
    const py = m.max(ry, m.min(cy, ry + rh));

    const dx = cx - px;
    const dy = cy - py;
    const dist = m.hypot(dx, dy) || 1;
    const overlap = rad - dist;

    if (overlap > 0) {
      const factor = (isA ? 1 : -1) * (overlap / dist);
      sol[0] = dx * factor;
      sol[1] = dy * factor;
      return true;
    }
    return false;
  }

  // 3. RECTANGULO - RECTANGULO (AABB)
  const overlapX1 = p1x + w1 - p2x;
  const overlapX2 = p2x + w2 - p1x;
  const overlapY1 = p1y + h1 - p2y;
  const overlapY2 = p2y + h2 - p1y;

  if (overlapX1 > 0 && overlapX2 > 0 && overlapY1 > 0 && overlapY2 > 0) {
    if (m.min(overlapX1, overlapX2) < m.min(overlapY1, overlapY2)) {
      sol[0] = overlapX1 < overlapX2 ? -overlapX1 : overlapX2;
    } else {
      sol[1] = overlapY1 < overlapY2 ? -overlapY1 : overlapY2;
    }
    return true;
  }

  return false;
}

function distCuadrad(origenX, origenY, objetivoX, objetivoY) {
  const dx = objetivoX - origenX;
  const dy = objetivoY - origenY;
  const distCuadrada = (dx * dx) + (dy * dy);
  
  // 100 al cuadrado es 10000
  return distCuadrada <= 30000;
}

function Atan2Polinomial(dy, dx) {
  if (dx === 0 && dy === 0) return 0;

  // Normalización rápida basada en el cuadrante
  const absX = m.abs(dx);
  const absY = m.abs(dy);
  const a = m.min(absX, absY) / m.max(absX, absY);
  const s = a * a;

  // Aproximación polinomial de bajo consumo de CPU
  let r = ((-0.0464964749 * s + 0.15931422) * s - 0.327622764) * s * a + a;

  if (absY > absX) r = 1.57079632679 - r; // 1.57079... es PI / 2
  if (dx < 0) r = 3.14159265359 - r;       // PI
  if (dy < 0) r = -r;

  return r; // Devuelve el ángulo en radianes
}

function mirarHacia(origenX, origenY, objetivoX, objetivoY) {
  
  // Devuelve el ángulo en radianes
  return Atan2Polinomial(objetivoY - origenY, objetivoX - origenX);//m.atan2(objetivoY - origenY, objetivoX - origenX);
}

     function iniciarAudio() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
        }
      }

// Cadena de notas (16 caracteres = 16 pasos del compás)
// '0' es la nota base (Do), '2' (Re), '4' (Mi), '5' (Fa), '7' (Sol), '9' (La), etc.



const MELODIA = "..00..11..22..11..33..66..44..55..88..99..77......";
const BATERIA = "XX..ZZ..XX..ZZ..ZZ..XX..XX..ZZ..XX..XX..ZZ..ZZ..XX..ZZ..ZZ..ZZ.XX..";


// 1. DICCIONARIO DE NOTAS (Mapeo de caracteres a frecuencias de C4 a B5)
const NOTAS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const m2f = c => c && c !== '.' && c !== 'X' && c !== 'Z' 
  ? 261.63 * (2 ** (NOTAS.indexOf(c) / 12)) 
  : 0;

// 2. FUNCIÓN SINTETIZADORA GENÉRICA (Audio API)
// Recibe un array: [esRuido, freqInicial, freqFinal, duracion, volumen]
const repSonido = s => {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') {
  audioCtx.resume();
}
  const t = audioCtx.currentTime,
        [esRuido, f1, f2, dur, vol] = s,
        g = audioCtx.createGain();

  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.01, t + dur);
  g.connect(audioCtx.destination);

  if (esRuido) {
    const sr = audioCtx.sampleRate,
          b = audioCtx.createBuffer(1, sr * dur, sr),
          d = b.getChannelData(0),
          r = audioCtx.createBufferSource(),
          f = audioCtx.createBiquadFilter();

    for (let i = 0; i < sr * dur; i++) d[i] = m.random() * 2 - 1;
    r.buffer = b;
    f.type = 'lowpass';
    f.frequency.setValueAtTime(f1, t);
    f.frequency.exponentialRampToValueAtTime(f2, t + dur);

    r.connect(f);
    f.connect(g);
    r.start(t);
    r.stop(t + dur);
  } else {
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(f1, t);
    osc.frequency.exponentialRampToValueAtTime(f2, t + dur);

    osc.connect(g);
    osc.start(t);
    osc.stop(t + dur);
  }
};

// 3. SECUENCIADOR DE MÚSICA BASS/DRUM
function iniciarMusica(leadStr, drumStr, bpm = 60) {
  let paso = 0;
  const ms = (60 / bpm / 4) * 1000;

  setInterval(() => {
    const noteChar = leadStr[paso];
    const drumChar = drumStr[paso];

    // Reproducir nota de sintetizador si no es silencio
    const freq = m2f(noteChar);
    if (freq) repSonido([0, freq, freq * 0.95, 0.12, 0.2]);

    // Batería
    if (drumChar === 'X') repSonido([1, 800, 30, 0.15, 0.7]);  // Bombo
    if (drumChar === 'Z') repSonido([1, 8000, 2000, 0.05, 0.2]); // Hi-Hat

    paso = (paso + 1) % leadStr.length;
  }, ms);
}

const INPUT = {
    axisX: 0,axisY: 0,a:0,b:0,
    joyId: null, // Guardamos solo el ID del toque del joystick
    startPos: null,
    
    init() {
        const base = document.getElementById('j');
        const stick = document.getElementById('s');
        const screenMid = window.innerWidth / 2;
     
       const maxDist = 45;

        // Escucha global para ahorrar listeners
        document.addEventListener('pointerdown', e => {
            if (e.target.closest('.action-btn')) return;
            
            if (e.clientX < screenMid && INPUT.joyId === null) {
                INPUT.joyId = e.pointerId;
                INPUT.startPos = { x: e.clientX, y: e.clientY };
                base.style.display = 'block';
                base.style.left = `${e.clientX}px`;
                base.style.top = `${e.clientY}px`;
                stick.style.transform = 'translate(-50%, -50%)';
            }
        });

        document.addEventListener('pointermove', e => {
            if (INPUT.joyId === e.pointerId && INPUT.startPos) {
                let dx = m.max(-maxDist, m.min(maxDist, e.clientX - INPUT.startPos.x));
                
                let dy = m.max(-maxDist, m.min(maxDist, e.clientY - INPUT.startPos.y));
                
                stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`; // Simplificado a solo eje X
                INPUT.axisX = dx / maxDist;
                INPUT.axisY = dy / maxDist;
            }
        });

        const endTrack = e => {
            if (INPUT.joyId === e.pointerId) {
                INPUT.joyId = null;
                INPUT.startPos = null;
                INPUT.axisX = 0;
                INPUT.axisY = 0;
                base.style.display = 'none';
                
            }
        };

        document.addEventListener('pointerup', endTrack);
        document.addEventListener('pointercancel', endTrack);

        // Botones directos con funciones en línea
        document.getElementById('x').onpointerdown = e => { e.preventDefault(); INPUT.onActionX?.(); };
      
        
      
        document.getElementById('z').onpointerdown = e => { e.preventDefault(); INPUT.onActionZ?.(); };
        
        
    }
};
INPUT.init();

function inicializarMapeoAgua(imagenAgua) {
   canvasAgua = crearCanvas(24, 16)
 ctxAgua = contexto(canvasAgua,true)

  ctxAgua.drawImage(imagenAgua, 0, 0);
}

function puntoEstaEnAgua(x, y, imgX, imgY, imgW, imgH, anguloRadianes) {
  // imgW = 160, imgH = 160
  
  if(!canvasAgua || !ctxAgua) return
  
  // 1. Traslación respecto al centro (imgX, imgY)
  const dx = x - imgX;
  const dy = y - imgY;
  
  // 2. Rotación inversa hacia el espacio local
  const cos = m.cos(-anguloRadianes);
  const sin = m.sin(-anguloRadianes);
  
  const localX = dx * cos - dy * sin;
  const localY = dx * sin + dy * cos;
  
  // 3. Mitades de las dimensiones
  const medioW = imgW / 2; // 80
  const medioH = imgH / 2; // 80

  // Comprobar si cae dentro del área delimitada [-80, 80]
  if (
    localX < -medioW || localX > medioW ||
    localY < -medioH || localY > medioH
  ) {
    return false; // Fuera del área
  }
  
  // 4. Mapear de [-medio, +medio] a espacio normalizado [0.0, 1.0]
  const relX = (localX + medioW) / imgW; 
  const relY = (localY + medioH) / imgH; 
  
  // Mapear a la textura base de 8x8
  const pixelX = m.floor(relX * canvasAgua.width);
  const pixelY = m.floor(relY * canvasAgua.height);
  
  // Limitar bordes exactos
  const px = m.max(0, m.min(pixelX, canvasAgua.width - 1));
  const py = m.max(0, m.min(pixelY, canvasAgua.height - 1));
  
  // 5. Lectura de opacidad
  const pixel = ctxAgua.getImageData(px, py, 1, 1).data;
  
  return pixel[3] > 10;
}

// ==========================================
// 2. SISTEMA DE BITMAP FONT & TINTADO
// ==========================================

const fuenteImg = new Image();
fuenteImg.src = 'f.png';

// ==========================================
// 1. CONFIGURACIÓN Y ESTADO DE TEXTOS
// ==========================================
const MAX_TEXTOS = 500;
const CARACTER_TAMAÑO = 8;        // Ancho/alto en px de cada letra en la imagen
const MAPA_CARACTERES_ANCHO = 7;  // Letras por fila en la imagen
const MAPA_CARACTERES = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ!.%*#";

// Arrays paralelos (Data Oriented Design)
let textos_txt = [];
let textos_color = [];
let textos_escala = f32Array(MAX_TEXTOS);
let textos_x = f32Array(MAX_TEXTOS);
let textos_y = f32Array(MAX_TEXTOS);
let textos_vida = f32Array(MAX_TEXTOS); 

let numTextos = 0;


// ==========================================
// 2. SISTEMA DE BITMAP FONT & TINTADO
// ==========================================
function dibujarTextoBitmap(texto, x, y, escala = 1, color = '#fff') {
  texto = texto.toUpperCase();
  
  // 1. Clave de caché única
  let key = fuenteImg.src + color;
  
  // 2. Comprobar/Guardar en caché usando operador lógico ||
  let imagen = imagenesTintadas[key] || (imagenesTintadas[key] = crearImagen(fuenteImg.width, fuenteImg.height, (ctx) => {
    let pos = [0, 0, fuenteImg.width, fuenteImg.height];
    ctx.drawImage(tintarImagen(fuenteImg, pos, color), ...pos);
  }));

  // Pre-calcular el tamaño escalado del carácter fuera del bucle
  let tamEscalado = (CARACTER_TAMAÑO * escala) | 0;

let centroX = x - ((texto.length * tamEscalado)/2)



  for (let i = 0; i < texto.length; i++) {
    const index = MAPA_CARACTERES.indexOf(texto[i]);
    
    if (index !== -1) {
      // Reemplazamos m.floor por | 0 para ahorrar bytes y velocidad
      const srcX = (index % MAPA_CARACTERES_ANCHO) * CARACTER_TAMAÑO;
      const srcY = ((index / MAPA_CARACTERES_ANCHO) | 0) * CARACTER_TAMAÑO;
      
      ctx.drawImage(
        imagen,
        srcX, srcY, CARACTER_TAMAÑO, CARACTER_TAMAÑO,
        (centroX + i * tamEscalado) | 0, (y | 0), tamEscalado, tamEscalado
      );
    }
  }
}

// ==========================================
// 3. GESTIÓN DE ESTRUCTURA Y MEMORIA
// ==========================================
function crearTexto(texto, x, y, escala = 1, color = '#fff') {
  if (numTextos >= MAX_TEXTOS) return;
  
  let i = numTextos++;
  textos_txt[i] = texto;
  textos_x[i] = x;
  textos_y[i] = y;
  textos_escala[i] = escala;
  textos_color[i] = color;
  textos_vida[i] = .5;
}

function eliminarTexto(i) {
  const ultimo = --numTextos;
  if (i !== ultimo) {
    textos_txt[i] = textos_txt[ultimo];
    textos_x[i] = textos_x[ultimo];
    textos_y[i] = textos_y[ultimo];
    textos_escala[i] = textos_escala[ultimo];
    textos_color[i] = textos_color[ultimo];
    textos_vida[i] = textos_vida[ultimo];
  }
}

// ==========================================
// 4. CICLO LÓGICO Y RENDERIZADO SEPARADOS
// ==========================================

// --- LÓGICA / CICLO (Update) ---
function textosCyclo(dt) {
  // Disminuye vida y elimina expirados en orden inverso
  for (let i = numTextos - 1; i >= 0; i--) {
    textos_vida[i] -= deltaFijo; // Duración: 0.5 segundos

    if (textos_vida[i] <= 0) {
      eliminarTexto(i);
    }
  }
}

function textoRender(i) {
  
  for (let i = 0; i < numTextos; i++) {
let progreso = textos_vida[i] / .5; // De  (inicio) a 0 (final)
let offsetY = (progreso) * 40; // Sube 20px durante su vida


alfa(limitMinMax(progreso, 0, 1)); // Aplica desvanecimiento
dibujarTextoBitmap(
  textos_txt[i],
  textos_x[i],
  textos_y[i] + offsetY,
  textos_escala[i],
  textos_color[i]
);
alfa(1); // Restaura alfa
  }
  
  

}

let conteoDeOleadas = 0;
let unicorniosOleada = 0;
let tiempoEntreOleadas = 0
// Tipos de unicornios: 0: Contaminador, 1: Melee, 2: Rango

let distribuciónTipos = [0, 0, 0]; 

function iniciarSiguienteOleada() {
  // 1. Escalar total de enemigos por oleada
  unicorniosOleada = 1 + (conteoDeOleadas * 2);
  let restantes = unicorniosOleada;

  // Resetear distribución
  distribuciónTipos[0] = 0;
  distribuciónTipos[1] = 0;
  distribuciónTipos[2] = 0;

  // 2. Repartición condicional por oleada
  if (conteoDeOleadas < 2) {
    // Oleada 1: Solo Tipo 0 (Contaminador)
    distribuciónTipos[0] = restantes;

  } else if (conteoDeOleadas < 3) {
    // Oleadas 2 y 3: Tipo 0 y Tipo 1 (Melee)
    distribuciónTipos[0] = (m.random() * (restantes - 1)) | 0 + 1;
    distribuciónTipos[1] = restantes - distribuciónTipos[0];

  } else {
    // Oleada 4+: Los 3 tipos activos
    distribuciónTipos[0] = (m.random() * (restantes - 2)) | 0 + 1;
    restantes -= distribuciónTipos[0];

    distribuciónTipos[1] = (m.random() * (restantes - 1)) | 0 + 1;
    distribuciónTipos[2] = restantes - distribuciónTipos[1];
  }

  conteoDeOleadas++;
}

//iniciarSiguienteOleada()
//tiempoEntreOleadas=0

function invocarEnemigo() {
  
  for (let i = 0; i < 15; i++) {
    if (numUnicornios >= 15 || unicorniosOleada <= 0) break;

    // Seleccionar cuál tipo instanciar que aún tenga disponibles en la distribución
    let tipoElegido = -1;
    for (let t = 0; t < 3; t++) {
      if (distribuciónTipos[t] > 0) {
        tipoElegido = t;
        distribuciónTipos[t]--;
        break;
      }
    }

    if (tipoElegido === -1) break;

    let x = rMinMax(0, LIMITE_MUNDO);
    let y = rMinMax(0, LIMITE_MUNDO);
    
    // Escalar la vida según la oleada
    let vida = limitMinMax(rMinMax(50 * conteoDeOleadas, 100 * conteoDeOleadas), 0, 1200);

    // Pasar el tipoElegido al constructor
    crearUnicornio(x, y, vida, tipoElegido);

    unicorniosOleada--;
  }
}
